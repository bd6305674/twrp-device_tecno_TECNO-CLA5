name: Release OrangeFox Vendor Boot

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (example: v1.0.0)"
        required: true
      release_name:
        description: "Release title"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      CCACHE_DIR: ${{ github.workspace }}/work/.ccache

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device-tree

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          large-packages: false
          tool-cache: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            git-lfs \
            gnupg \
            gperf \
            imagemagick \
            lib32ncurses5-dev \
            lib32readline-dev \
            lib32z1-dev \
            liblz4-tool \
            libncurses5 \
            libncurses5-dev \
            libsdl1.2-dev \
            libssl-dev \
            libxml2 \
            libxml2-utils \
            lzop \
            openjdk-11-jdk \
            pngcrush \
            python3 \
            repo \
            rsync \
            schedtool \
            squashfs-tools \
            xsltproc \
            zip \
            zlib1g-dev

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-release-${{ github.event.inputs.tag }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Initialize OrangeFox source
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p work
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git orangefox-sync
          cd orangefox-sync
          ./orangefox_sync.sh --branch 12.1 --path "${GITHUB_WORKSPACE}/work"

      - name: Add device dependencies
        working-directory: ${{ github.workspace }}/work
        run: |
          mkdir -p device/tecno
          rsync -a --delete "${GITHUB_WORKSPACE}/device-tree/" device/tecno/TECNO-CLA5/
          cat > device/tecno/TECNO-CLA5/vendorsetup.sh <<'EOF'
          #!/bin/sh
          # CI: dependencies are prepared explicitly in the workflow.
          EOF
          if [ -d device/transsion/mt6789-common/.git ]; then
            git -C device/transsion/mt6789-common fetch --depth=1 origin fox_12.1
            git -C device/transsion/mt6789-common checkout -B fox_12.1 FETCH_HEAD
          else
            rm -rf device/transsion/mt6789-common
            git clone --depth=1 -b fox_12.1 \
              https://github.com/transsion-mt6789/twrp-device_transsion_mt6789-common.git \
              device/transsion/mt6789-common
          fi
          cat > device/transsion/mt6789-common/vendorsetup.sh <<'EOF'
          #!/bin/sh
          # CI: dependencies are prepared explicitly in the workflow.
          EOF

      - name: Build vendor boot image
        working-directory: ${{ github.workspace }}/work
        run: |
          export USE_CCACHE=1
          export CCACHE_EXEC="$(command -v ccache)"
          ccache -M 10G
          set +e
          source build/envsetup.sh
          ENVSETUP_STATUS=$?
          set -e
          echo "envsetup exit status: ${ENVSETUP_STATUS}"
          lunch twrp_CLA5-eng
          mka vendorbootimage

      - name: Collect release files
        id: collect
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p release-assets
          cp work/out/target/product/TECNO-CLA5/*vendor_boot*.img release-assets/
          if ls work/out/target/product/TECNO-CLA5/*vendor_boot*.img >/dev/null 2>&1; then
            sha256sum work/out/target/product/TECNO-CLA5/*vendor_boot*.img > release-assets/SHA256SUMS.txt
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.release_name }}
          body: |
            OrangeFox vendor_boot release for TECNO-CLA5.
          files: |
            release-assets/*
